    <path d="M26,8 H46 V46 H26 Z"/>
    <path d="M26,50 H46 V88 H26 Z"/>
    <path d="M50,50 L89.95,50 A40,40 0 0 1 50,88 Z"/>
  </g>
  <path d="M50,8 A40,40 0 0 1 89.95,46 L50,46 Z" fill="#6D5BD5"/>
</svg>
