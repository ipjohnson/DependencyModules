name: build-package

on:
  push:
    branches: ['**']
    tags-ignore: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write
  packages: write

env:
  # Ratchet: raise this as coverage improves. Kept just below the current figure so an
  # unrelated change does not fail the build on rounding.
  COVERAGE_THRESHOLD: 70

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - run: dotnet restore DependencyModules.sln

      - run: dotnet build DependencyModules.sln --no-restore --configuration Release

      # Runs every test suite with coverage collection and merges the results.
      - name: Test with coverage
        run: ./scripts/coverage.sh "${{ env.COVERAGE_THRESHOLD }}"

      - name: Publish coverage to the job summary
        if: always()
        run: |
          if [ -f artifacts/coverage/SummaryGithub.md ]; then
            cat artifacts/coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: artifacts/coverage

      # Packs and consumes the packages the way a real user would. Catches packaging faults
      # that a ProjectReference-based test suite cannot see.
      - name: Verify packages
        run: ./scripts/verify-packages.sh

      # The badge lives on an orphan branch so README can link to a stable raw URL without
      # adding commit noise to main.
      - name: Publish coverage badge
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          set -euo pipefail

          BADGE_DIR="$(mktemp -d)"
          cp artifacts/coverage/badge_linecoverage.svg "${BADGE_DIR}/coverage.svg"
          cp artifacts/coverage/badge_branchcoverage.svg "${BADGE_DIR}/branch-coverage.svg"
          cp artifacts/coverage/Summary.txt "${BADGE_DIR}/summary.txt"

          cd "${BADGE_DIR}"
          git init -q
          git checkout -q -b badges
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "Coverage badge for ${GITHUB_SHA}"
          git push -q --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" \
            badges

  publish-prerelease:
    # Development builds for anyone tracking main; the released packages come from release.yaml.
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          source-url: https://nuget.pkg.github.com/ipjohnson/index.json
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: dotnet restore DependencyModules.sln

      - run: dotnet build DependencyModules.sln --no-restore --configuration Release

      - name: Pack prerelease
        run: |
          dotnet pack DependencyModules.sln --configuration Release --no-build \
            --output ./artifacts/packages \
            --version-suffix "ci.${{ github.run_number }}"

      - name: Push to GitHub Packages
        run: |
          dotnet nuget push "./artifacts/packages/*.nupkg" \
            --api-key ${{ secrets.GITHUB_TOKEN }} \
            --source "https://nuget.pkg.github.com/ipjohnson/index.json" \
            --skip-duplicate --no-symbols

      - uses: actions/upload-artifact@v4
        with:
          name: prerelease-packages
          path: ./artifacts/packages/*
